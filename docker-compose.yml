# ==============================================================================
# Pixbe CRM - Production Full-Stack Docker Compose Orchestration
# Includes: Pixbe CRM Node.js Web Application + PostgreSQL 16 Database
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PIXBE CRM APPLICATION SERVICE
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixbe-crm:latest
    container_name: pixbe-crm-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - PIXBE_DATA_DIR=/app/.data
      - APP_URL=${APP_URL:-http://localhost:8080}

      # Database Configuration (Defaults to internal 'db' service)
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - PIXBE_STORE=${PIXBE_STORE:-postgres}
      - CONTROL_DB_NAME=${CONTROL_DB_NAME:-pixbe_control}
      - ADMIN_DB_NAME=${ADMIN_DB_NAME:-${AWS_RDS_DATABASE:-postgres}}
      - PIXBE_AUTO_IMPORT_JSON=${PIXBE_AUTO_IMPORT_JSON:-true}

      # Remote AWS RDS / Aurora Configuration (optional override)
      - AWS_RDS_HOST=${AWS_RDS_HOST:-}
      - AWS_RDS_PORT=${AWS_RDS_PORT:-}
      - AWS_RDS_DATABASE=${AWS_RDS_DATABASE:-}
      - AWS_RDS_USER=${AWS_RDS_USER:-}
      - AWS_RDS_PASSWORD=${AWS_RDS_PASSWORD:-}
      - AWS_RDS_SSL=${AWS_RDS_SSL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-${AWS_REGION:-ap-south-1}}
      - AWS_S3_RECORDINGS_PREFIX=${AWS_S3_RECORDINGS_PREFIX:-recordings/}
      - AWS_S3_EXCEL_PREFIX=${AWS_S3_EXCEL_PREFIX:-excel/}
      - AWS_S3_ATTACHMENTS_PREFIX=${AWS_S3_ATTACHMENTS_PREFIX:-attachments/}
      - COGNITO_REGION=${COGNITO_REGION:-ap-south-1}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI:-http://localhost:8080/}
      - ALLOW_LEGACY_ADMIN=${ALLOW_LEGACY_ADMIN:-}

      # AI Services
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # Meta / Facebook & Instagram Lead Ads
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-}
      - META_PAGE_ID=${META_PAGE_ID:-}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN:-}
    volumes:
      # Persistent storage for multi-tenant state and json store
      - pixbe_app_data:/app/.data
    # Local Postgres is optional. RDS is used when AWS_RDS_HOST is set.
    # Start the local database only with: docker compose --profile local-db up -d
    depends_on:
      db:
        condition: service_healthy
        required: false
        restart: true
    networks:
      - pixbe-network

  # ----------------------------------------------------------------------------
  # 2. POSTGRESQL DATABASE SERVICE
  # ----------------------------------------------------------------------------
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: pixbe-crm-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pixbe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pixbe-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  pixbe_app_data:
    driver: local
  pixbe_postgres_data:
    driver: local

networks:
  pixbe-network:
    driver: bridge
