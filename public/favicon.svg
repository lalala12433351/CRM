<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="arcleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#arcleGrad)" />

  <!-- Geometric Modern Facet Overlay -->
  <path d="M64 0L32 32L64 64Z" fill="#ffffff" fill-opacity="0.08" />
  <path d="M0 64L32 32L0 0Z" fill="#000000" fill-opacity="0.08" />

