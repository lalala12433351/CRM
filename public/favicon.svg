    <!-- Main Rocket / Airplane Shape -->
    <path d="M46 18L18 30L28 36L40 24L30 38L36 46L46 18Z" fill="#ffffff" />
    <!-- Pulse Sparkle Point -->
    <circle cx="46" cy="18" r="3.5" fill="url(#accentGrad)" />
